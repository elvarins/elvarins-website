<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Order status | Elvarins</title><style>body{font-family:Inter,system-ui,sans-serif;color:#162744;background:#f6f7fa;margin:0}main{max-width:720px;margin:12vh auto;padding:30px;background:#fff;border-radius:16px;box-shadow:0 8px 34px #10244215}a{color:#1c56c9}h1{font-size:28px}</style></head><body><main><a href="/">← Back to Elvarins</a><h1>Checking your order</h1><p id="status" role="status" aria-live="polite">Verifying payment confirmation…</p><p>A Stripe return page alone does not confirm payment. Please keep your order reference and contact <a href="mailto:sales@elvarins.com">sales@elvarins.com</a> if you need assistance.</p></main><script>const u=new URL(location.href),id=u.searchParams.get('session_id'),out=document.getElementById('status');if(!id)out.textContent='No payment session found.';else fetch('/api/checkout/status?session_id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>r.json()).then(d=>{out.textContent=d.status==='paid'?'Payment confirmed. Thank you for your order.':d.status==='processing'?'Your payment is processing. Please check your email for confirmation.':'We could not confirm this payment. Please contact support.'}).catch(()=>out.textContent='Payment status could not be checked. Please contact support.');</script></body></html>
